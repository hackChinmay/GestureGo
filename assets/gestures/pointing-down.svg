<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <g stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="#FDE68A">
    <!-- Hand Silhouette: Inverted hand with index pointing straight DOWN -->
